<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Jenkins CI/CD 성공!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        .icon {
            font-size: 4rem;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
        }
        p {
            color: #7f8c8d;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }
        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎉</div>
        <h1>Hello World!</h1>
        <p>Spring Boot 애플리케이션이 외부 Tomcat 배포 및 Jenkins 파이프라인 연동에 성공했습니다.</p>
        <span class="badge">CI/CD Pipeline Completed</span>
    </div>
</body>
</html>
